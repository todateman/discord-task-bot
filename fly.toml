# fly.toml app configuration file generated for discord-task-bot on 2026-03-14T23:08:25+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'discord-task-bot'
primary_region = 'sin'

[build]

[env]
  SHEET_NAME = 'タスク一覧'
  WEEKLY_REPORT_DAY = 'sun'
  WEEKLY_REPORT_HOUR = '9'

[processes]
  app = "python -m src.bot"

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
