app = "discord-task-bot"        # fly launch で自動生成した名前に変更
primary_region = "nrt"          # 東京リージョン

[build]

[env]
  # 非機密の設定はここに書いても可（機密はfly secrets setで）
  SHEET_NAME      = "タスク一覧"
  WEEKLY_REPORT_DAY  = "monday"
  WEEKLY_REPORT_HOUR = "9"

# Botはリクエストを受けないのでHTTPサービス不要
# ただし Fly.io の "always on" を維持するためにHTTPヘルスチェックを設定
[http_service]
  internal_port        = 8080
  force_https          = false
  auto_stop_machines   = false   # Botを常時起動
  auto_start_machines  = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
